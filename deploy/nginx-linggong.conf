# /etc/nginx/conf.d/linggong.conf
#
# 零工小市场：前端静态托管 (80) + API 反向代理 (/api -> 127.0.0.1:8000)
# 使用方法：
#   1. 把 frontend/dist 上传到 /var/www/linggong/dist
#   2. 本文件放到 /etc/nginx/conf.d/linggong.conf
#   3. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name 47.94.96.227;

    root /var/www/linggong/dist;
    index index.html;

    # 前端路由是 Hash 模式，理论上不会 404；
    # 这里仍做兜底，避免以后切 History 模式时踩坑
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传图片（证书/封面）需要放宽体积
        client_max_body_size 10m;

        # 长请求（如 LLM 风控）适当延长
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # 健康检查，便于运维探活
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
