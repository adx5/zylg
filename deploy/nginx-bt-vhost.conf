# 宝塔面板站点配置：把下面这段「location ^~ /api/」加到你现有站点的 server 块里
#
# 步骤：
#   1. 找到站点配置文件（宝塔：/www/server/panel/vhost/nginx/ 下）
#        grep -rl "47.94.96.227" /www/server/panel/vhost/nginx/
#   2. 在 server { ... } 内部、`location /` 之前插入下面的 location ^~ /api/ 段
#   3. nginx -t && systemctl reload nginx
#
# 注意：用 ^~ 前缀，避免被站点里 `location ~ \.php` 之类的正则抢走；
#       同时它必须排在 `location /` 之前（nginx 不看顺序，但 ^~ 优先级更高，写哪都行）。

# ↓↓↓ 复制这一段到站点 server 块内 ↓↓↓
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 10m;

    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
}
# ↑↑↑ 复制到此处结束 ↑↑↑


